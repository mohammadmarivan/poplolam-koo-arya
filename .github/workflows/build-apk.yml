name: Build poolamkoo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrappers executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Apply rebrand
        run: |
          if [ -f rebrand.sh ]; then
            chmod +x rebrand.sh
            bash rebrand.sh || true
          fi

      - name: Build Debug APK
        run: |
          set -e
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f android/gradlew ]; then
            cd android && ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew not found. If this is Flutter, use the Flutter workflow."
            exit 1
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          find . -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} dist/ \;
          ls -lah dist || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poplolam-koo-arya-apk
          path: dist/*.apk
          if-no-files-found: error
